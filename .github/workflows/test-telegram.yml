name: Telegram Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram message
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN_NEW }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Chat ID exists: ${CHAT_ID:+YES}"

          curl -sS \
            -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🤖 Jay's Job Hunter test message"
